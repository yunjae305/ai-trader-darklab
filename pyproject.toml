[project]
name = "ai-trader"
version = "0.1.0"
description = "AI 가 선정·매수·매도를 스스로 판단하는 무인 매매 다크랩"
requires-python = ">=3.10"
dependencies = ["anthropic", "mlflow", "requests", "pandas", "pyarrow", "yfinance"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
