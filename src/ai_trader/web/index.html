<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI주식자동매매</title>
<style>
:root{
  --bg:#EDE7DE; --card:#FBF9F6; --tile:#EFE9E1; --ink:#14120F; --dim:#8D8579;
  --line:#E2DBCE; --green:#0F9D76; --deep:#0B7D5E; --red:#E5484D; --blue:#2F6FED;
  --amber:#E8892B; --nav:#221F1A;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",Pretendard,system-ui,sans-serif;
  padding:0 0 96px;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding:0 18px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}

/* 헤더 */
.hd{display:flex;justify-content:space-between;align-items:flex-start;padding:26px 0 16px}
h1{font-size:27px;font-weight:800;margin:0;letter-spacing:-1px}
.tag{color:var(--dim);font-size:13px;margin:5px 0 0}
.rf{width:52px;height:52px;border-radius:50%;border:0;background:var(--card);color:var(--blue);
  font-size:23px;cursor:pointer;flex:0 0 auto;box-shadow:0 2px 6px rgba(0,0,0,.05)}

/* 카드 */
.card{background:var(--card);border-radius:22px;padding:22px 20px;margin:0 0 16px;
  box-shadow:0 1px 3px rgba(0,0,0,.035)}
.card h2{font-size:21px;font-weight:800;margin:0;letter-spacing:-.5px}
.cap{color:var(--dim);font-size:13.5px;margin:5px 0 16px}
.eyebrow{font:11px/1 ui-monospace,Menlo,monospace;letter-spacing:2.6px;color:var(--dim)}
.big{font-size:39px;font-weight:800;letter-spacing:-1.6px;margin:9px 0 0}

/* 맥박 */
.pulse{position:relative;width:54px;height:54px;flex:0 0 auto}
.pulse b{position:absolute;inset:0;border-radius:50%;opacity:.16}
.pulse i{position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;
  border-radius:50%}
.pulse svg{position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);width:34px;height:16px}

/* 배너 */
.banner{display:flex;align-items:flex-start;gap:9px;background:var(--tile);border-radius:14px;
  padding:14px 15px;margin-top:18px}
.banner .txt{flex:1;min-width:0}
.banner .t1{font-weight:700;font-size:14.5px}
.banner .t2{color:var(--dim);font-size:12.5px;margin-top:3px}

/* 타일 */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:16px}
.tiles.c3{grid-template-columns:repeat(3,1fr)}
.tile{background:var(--tile);border-radius:16px;padding:16px 15px}
.tile .k{font-size:12.5px;color:var(--dim);display:flex;align-items:center;gap:7px;font-weight:600}
.tile .v{font-size:22px;font-weight:800;margin:9px 0 4px;letter-spacing:-.8px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .n{font-size:11.5px;color:var(--dim)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:0 0 auto}
.ic{width:27px;height:27px;display:block;margin-bottom:9px}

/* 행 */
.row{display:flex;align-items:flex-start;gap:12px;padding:16px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0;padding-top:4px}
.grow{flex:1;min-width:0}
.nm{font-weight:800;font-size:17px;letter-spacing:-.4px}
.line1{display:flex;align-items:baseline;gap:7px;min-width:0}
.line1 .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.line1 .cd,.line1 .st{flex:0 0 auto}
.cd{color:var(--dim);font-size:13.5px;font-family:ui-monospace,Menlo,monospace}
.sub2{color:var(--green);font-size:13px;font-weight:700;margin-top:2px}
.why{color:var(--dim);font-size:13.5px;margin-top:6px;line-height:1.55}
.chev{color:#C8C0B2;font-size:19px;flex:0 0 auto;align-self:center}
.t{font-size:12px;color:var(--dim);font-family:ui-monospace,Menlo,monospace;flex:0 0 auto;padding-top:2px}

.badge{font:800 12px/1 system-ui;padding:9px 11px;border-radius:9px;letter-spacing:.4px;flex:0 0 auto}
.b-BUY{background:#DCF2EA;color:#07694F} .b-SELL{background:#FBE0E1;color:#B92F34}
.b-HOLD{background:#FBE6D2;color:#C4690F}
.st{font-size:11px;padding:4px 8px;border-radius:7px;background:var(--tile);color:var(--dim);font-weight:600}
.st-FILLED{background:#DCF2EA;color:#07694F} .st-REJECTED,.st-ERROR{background:#FBE0E1;color:#B92F34}
.up{color:var(--red)} .down{color:var(--blue)} .flat{color:var(--dim)}
.pos{color:var(--green)} .neg{color:var(--red)}

/* 링 */
.ring{width:50px;height:50px;flex:0 0 50px;border-radius:50%;display:grid;place-items:center}
.ring span{background:var(--card);width:41px;height:41px;border-radius:50%;display:grid;
  place-items:center;font-weight:800;font-size:15px}
.alloc{display:grid;grid-template-columns:150px 1fr;gap:20px;align-items:center;margin:6px 0 18px}
.donut{width:150px;height:150px;border-radius:50%;position:relative;display:grid;place-items:center}
.donut:after{content:"";position:absolute;width:88px;height:88px;border-radius:50%;background:var(--card)}
.donut b{position:relative;z-index:1;font-size:15px;text-align:center;line-height:1.25}
.legend{display:grid;gap:9px}.legend .lg{display:flex;align-items:center;gap:8px;font-size:13px}
@media(max-width:420px){.alloc{grid-template-columns:125px 1fr}.donut{width:125px;height:125px}.donut:after{width:74px;height:74px}}

/* 지수 */
.grid-ix{display:grid;grid-template-columns:repeat(auto-fit,minmax(142px,1fr));gap:10px}
.grid-ix .ix{background:var(--tile);border-radius:16px;padding:15px}
.ix .k{font-size:12.5px;color:var(--dim);font-weight:600}
.ix .v{font:800 20px/1.2 ui-monospace,Menlo,monospace;margin:8px 0 5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ix .n{font-size:12.5px;font-weight:700}
.note{display:flex;gap:10px;align-items:flex-start;margin-top:14px}
.note .g{width:26px;height:26px;flex:0 0 auto}

/* 엔진 */
.sw{width:62px;height:34px;border-radius:99px;border:0;background:#D8D0C2;position:relative;
  cursor:pointer;flex:0 0 auto;transition:background .18s}
.sw.on{background:#33C463}
.sw i{position:absolute;top:3px;left:3px;width:28px;height:28px;border-radius:50%;background:#fff;
  transition:left .18s;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.sw.on i{left:31px}
.run{border:0;background:var(--deep);color:#fff;font:800 17px system-ui;padding:14px 22px;
  border-radius:14px;cursor:pointer;display:flex;align-items:center;gap:8px;flex:0 0 auto}
.run:disabled{background:#D8D0C2;color:#fff;cursor:not-allowed}
.engrow{display:flex;align-items:center;gap:12px;padding:18px 0 0;margin-top:16px;
  border-top:1px solid var(--line)}
.bar{height:8px;background:var(--tile);border-radius:99px;overflow:hidden;margin:10px 0 7px}
.bar i{display:block;height:100%;background:var(--green)}
.scanrow{display:flex;justify-content:space-between;align-items:center;margin-top:16px;
  font-size:15px;font-weight:600}
.scanrow .l{display:flex;align-items:center;gap:8px;color:var(--dim)}

.kv{display:flex;justify-content:space-between;padding:11px 0;border-top:1px solid var(--line);font-size:14.5px}
.kv:first-child{border-top:0} .kv b{font-weight:800}
.hint{display:inline-flex;align-items:center;gap:8px;background:var(--tile);border-radius:12px;
  padding:11px 14px;font-size:13.5px;color:var(--dim);margin-bottom:6px}
.none{color:var(--dim);font-size:13.5px;background:var(--tile);border-radius:14px;padding:15px;margin-top:8px}
.warn{background:#FBE6D2;color:#8A4A08;border-radius:14px;padding:14px;font-size:13.5px;margin-top:14px}
a.plain{color:inherit;text-decoration:none}

/* 상세실적 시트 (DartLab) */
.sheet{position:fixed;inset:0;background:var(--bg);z-index:20;overflow-y:auto;
  padding:0 0 40px;display:none}
.sheet.on{display:block}
.shhd{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:22px 0 18px}
.shhd .ttl{font-weight:800;font-size:18px;letter-spacing:-.4px;text-align:center;flex:1}
.icobtn{width:46px;height:46px;border-radius:50%;border:0;background:var(--card);color:var(--green);
  font-size:20px;cursor:pointer;flex:0 0 auto;box-shadow:0 2px 6px rgba(0,0,0,.05)}
.dl{display:flex;align-items:center;gap:12px;margin:6px 0 18px}
.dl .mk{width:34px;height:34px;flex:0 0 auto}
.dl .b1{font:800 25px/1 Georgia,"Times New Roman",serif;letter-spacing:-.5px}
.dl .b2{color:var(--green);font-weight:800;font-size:14px;margin-left:7px}
.dl .b3{color:var(--dim);font-size:13px;margin-top:4px}
.who{background:var(--card);border-radius:18px;padding:17px 19px;display:inline-block;margin-bottom:16px}
.who .n1{font-size:23px;font-weight:800;letter-spacing:-.7px}
.who .n2{color:var(--dim);font-size:13px;margin-top:5px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--tile);
  border-radius:13px;padding:4px;margin-bottom:18px}
.seg button{border:0;background:transparent;color:var(--dim);font:700 14px system-ui;
  padding:11px 4px;border-radius:10px;cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.fin h3{font:800 19px/1 system-ui;color:var(--green);margin:0 0 5px;letter-spacing:-.4px}
.fin .yr{color:var(--dim);font-size:13px;margin:0 0 14px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.fn{border-collapse:collapse;width:100%;font-size:14px}
table.fn th,table.fn td{padding:15px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
table.fn th{color:var(--dim);font-weight:700;font-size:13.5px;text-align:right}
table.fn th:first-child,table.fn td:first-child{text-align:left;position:sticky;left:0;
  background:var(--card);white-space:normal;min-width:132px}
table.fn td{text-align:right;font-family:ui-monospace,Menlo,monospace;font-weight:600}
table.fn td.nil{color:#C8C0B2;font-weight:400}
table.fn tr:last-child th,table.fn tr:last-child td{border-bottom:0}

/* 하단 탭 */
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(240,235,227,.97);
  backdrop-filter:blur(14px);padding:9px 12px calc(9px + env(safe-area-inset-bottom))}
nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
nav button{border:0;background:transparent;color:var(--dim);font:700 12.5px system-ui;
  padding:11px 4px;border-radius:16px;display:grid;gap:5px;justify-items:center;cursor:pointer}
nav button.on{background:var(--nav);color:#F6F2EA}
nav svg{width:21px;height:21px}
.tab{display:none} .tab.on{display:block}
</style>
</head>
<body>
<div class="wrap">
  <div class="hd">
    <div><h1>AI주식자동매매</h1><p class="tag" id="sub">부자가 되는 가장 빠른 지름길</p></div>
    <button class="rf" onclick="loadAll()">⟳</button>
  </div>
  <section id="tab-command" class="tab on"></section>
  <section id="tab-radar" class="tab"></section>
  <section id="tab-portfolio" class="tab"></section>
  <section id="tab-control" class="tab"></section>
</div>

<div class="sheet" id="sheet"><div class="wrap">
  <div class="shhd">
    <button class="icobtn" onclick="closeFin()">‹</button>
    <span class="ttl">상세실적</span>
    <button class="icobtn" id="fin-rf" onclick="openFin(FIN_SYM, true)">⟳</button>
  </div>
  <div id="fin-body"></div>
</div></div>

<nav><div class="in">
  <button class="on" data-tab="command"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="7.5" height="7.5" rx="2.2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2.2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2.2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2.2"/></svg>Command</button>
  <button data-tab="radar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="12" r="7.5"/><circle cx="12" cy="12" r="2.2"/><path d="M12 1.5v3.4M12 19.1v3.4M1.5 12h3.4M19.1 12h3.4" stroke-linecap="round"/></svg>Radar</button>
  <button data-tab="portfolio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="12" r="8.6"/><path d="M12 3.4v8.6l6.1 4" stroke-linecap="round"/></svg>Portfolio</button>
  <button data-tab="control"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M3 7.5h11M19.5 7.5h1.5M3 16.5h5.5M14 16.5h7"/><circle cx="17" cy="7.5" r="2.3"/><circle cx="11" cy="16.5" r="2.3"/></svg>Control</button>
</div></nav>

<script>
const T = new URLSearchParams(location.search).get('t') || '';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
const won = n => n == null ? '—' : Math.round(n).toLocaleString('ko-KR') + '원';
const num = n => n == null ? '—' : Math.round(n).toLocaleString('ko-KR');
const marketMoney = (n, market) => n == null ? '—' : market === 'US'
  ? '$' + Number(n).toFixed(2) : Math.round(n).toLocaleString('ko-KR') + '원';
const pct = n => n == null ? '—' : (n > 0 ? '+' : '') + Number(n).toFixed(2) + '%';
const cls = n => n == null ? 'flat' : n > 0 ? 'up' : n < 0 ? 'down' : 'flat';
const hhmm = ts => ts ? String(ts).slice(5, 16).replace('T', ' ') : '';
const hm = ts => ts ? String(ts).slice(11, 16) : '';
const clip = (s, n) => { s = String(s ?? ''); if (s.length <= n) return s;
  const c = s.slice(0, n), sp = c.lastIndexOf(' ');
  return (sp > n * 0.6 ? c.slice(0, sp) : c).trimEnd() + '…'; };
const CHEV = '<span class="chev">›</span>';

async function api(p) {
  // 경로에 이미 쿼리가 있으면 ? 를 또 붙이면 안 된다 — 토큰이 앞 값에 먹힌다.
  const r = await fetch(p + (p.includes('?') ? '&' : '?') + 't=' + encodeURIComponent(T));
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.status);
  return r.json();
}
const none = m => `<div class="none">${esc(m)}</div>`;
const card = (title, cap, body) =>
  `<div class="card"><h2>${esc(title)}</h2><p class="cap">${esc(cap)}</p>${body}</div>`;

/* ----------------------------------------------------------------- Engine */
function engineBlock(e, g) {
  if (!e) return '';
  const on = e.running;
  let bar = '', when = '—';
  if (e.next_scan_at && e.last_cycle_at) {
    const a = Date.parse(e.last_cycle_at), b = Date.parse(e.next_scan_at);
    const p = Math.max(0, Math.min(100, (Date.now() - a) / (b - a) * 100));
    bar = `<div class="bar"><i style="width:${p}%"></i></div>`;
    when = String(e.next_scan_at).slice(5, 19).replace('T', ' ').replace('-', '/');
  }
  return `<div class="engrow">
      <div class="grow">
        <div style="font-weight:800;font-size:18px;letter-spacing:-.4px">자동매매</div>
        <div class="cap" style="margin:4px 0 0">${on ? esc(e.mode) : '정지됨 · 켜면 ' + esc(e.would_start_as)}</div>
      </div>
      <button class="sw ${on ? 'on' : ''}" id="eng-sw" onclick="toggleEngine(${on})"><i></i></button>
      <button class="run" id="eng-run" onclick="runOnce()"><svg viewBox="0 0 24 24" width="19" height="19" fill="currentColor"><path d="M13 2L4.5 13.5H11l-1 8.5L19 10.5h-6.5z"/></svg>Run</button>
    </div>
    ${on ? `<div class="scanrow"><span class="l">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9">
          <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.4 2" stroke-linecap="round"/></svg>
        Next scan</span><b class="mono">${when}</b></div>
      ${bar}
      <div class="cap" style="margin:0">판단 ${g.cycle_seconds < 60 ? g.cycle_seconds + '초' : Math.round(g.cycle_seconds / 60) + '분'} · 감시 ${g.watch_seconds}초 · pid ${e.pid}</div>`
      : `<div class="cap" style="margin:12px 0 0">실주문 ${g.live_trading
          ? '<b class="neg">허용</b> (AI_TRADER_LIVE=1)' : '<b class="pos">차단</b>'}
          — 이 버튼은 그 설정을 바꾸지 못한다</div>`}
    <div id="eng-msg" class="why"></div>`;
}
async function post(p) {
  return (await fetch(p + '?t=' + encodeURIComponent(T), {method: 'POST'})).json();
}
function busy(m) {
  ['eng-sw', 'eng-run'].forEach(i => { const el = $(i); if (el) el.disabled = true; });
  const el = $('eng-msg'); if (el) el.textContent = m;
}
async function toggleEngine(on) {
  busy(on ? '정지하는 중…' : '시작하는 중…');
  const out = await post(on ? '/api/engine/stop' : '/api/engine/start');
  if (!out.ok && out.reason) { const m = $('eng-msg'); if (m) m.textContent = out.reason; }
  setTimeout(loadAll, 700);
}
async function runOnce() {
  busy('한 사이클 도는 중…');
  const out = await post('/api/engine/once');
  const m = $('eng-msg');
  if (m) m.textContent = out.ok ? (out.output || '완료') : (out.reason || out.error || '실패');
  setTimeout(loadAll, 700);
}

/* ---------------------------------------------------------------- Command */
function renderCommand(d) {
  const lab = d.lab, g = d.guardrails, live = lab.market_open && lab.source !== 'synthetic';
  const col = live ? 'var(--green)' : 'var(--red)';

  const desk = `<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:flex-start">
      <div>
        <div class="eyebrow">LIVE MARKET DESK</div>
        <p class="big">${esc(lab.market_label)}</p>
        <p class="cap mono" style="margin:7px 0 0">${esc(d.generated_at).slice(5).replace('-', '/')}</p>
      </div>
      <div class="pulse"><b style="background:${col}"></b><i style="background:${col}"></i>
        <svg viewBox="0 0 34 16" fill="none" stroke="${col}" stroke-width="1.8" stroke-linecap="round">
          <path d="M1 8h6l3-6 4 12 3.5-8 3 4h12"/></svg></div>
    </div>
    ${lab.source === 'synthetic' ? banner('합성 시장으로 돌고 있다', '토스 키가 없다 — 이 숫자는 실제 시세가 아니다', d.generated_at) : ''}
    ${d.brain_backend === 'none' ? banner('퀀트 점수로 매매 중', 'Claude/Codex 사용 불가 · brain=quant-fallback', '') : ''}
    <div class="tiles" style="margin-top:14px">
      ${Object.entries(d.market_sessions || {}).map(([mk, s]) => `<div class="tile">
        <div class="k"><i class="dot" style="background:${s.open ? 'var(--green)' : 'var(--red)'}"></i>${mk === 'KR' ? '국내장' : '미국장'}</div>
        <div class="v" style="font-size:20px">${s.open ? '진행 중' : '마감'}</div>
        <div class="n mono">${esc(s.local_time)} ${esc(s.zone)}</div></div>`).join('')}
    </div>
    <div class="tiles">
      ${tile('var(--green)', '총 평가', won(lab.equity), lab.mode === 'kiwoom-demo'
        ? '키움 모의계좌 · 추정자산' : '자체 장부 · ' + esc(lab.mode))}
      ${tile('var(--red)', '당일 손익', pct(lab.day_return_pct), lab.mode === 'kiwoom-demo'
        ? `기준 ${won(lab.day_start_equity)} · 누적 ${pct(lab.total_return_pct)} (${won(lab.pnl_amount)})`
        : '기준 ' + won(lab.day_start_equity), cls(lab.day_return_pct))}
      ${tile('var(--green)', '예수금', won(lab.cash ?? Object.values(lab.sleeves).reduce((a, s) => a + s.cash, 0)),
        lab.mode === 'kiwoom-demo' ? '키움 주문가능금액' : '안정+공격 합산')}
      ${tile('var(--amber)', '오픈 포지션', String(lab.positions.length), '보유 종목')}
    </div></div>`;

  const ctrl = card('AI Trading 컨트롤', '스캐너, 리스크 게이트, 주문 엔진', `

/* --------------------------------------------------------------- DartLab */
let FIN_SYM = '', FIN_DIV = 'BS', FIN_DATA = null;

/* 길게 누르면 상세실적. 손가락이 움직이면 스크롤이므로 취소한다. */
function holdable(el, symbol) {
  let timer = null, sx = 0, sy = 0;
  const cancel = () => { clearTimeout(timer); timer = null; };
  el.addEventListener('pointerdown', e => {
    sx = e.clientX; sy = e.clientY;
    timer = setTimeout(() => { timer = null; openFin(symbol); }, 480);
  });
  el.addEventListener('pointermove', e => {
    if (timer && Math.hypot(e.clientX - sx, e.clientY - sy) > 10) cancel();
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(t => el.addEventListener(t, cancel));
  el.addEventListener('contextmenu', e => e.preventDefault());
}

async function openFin(symbol, force) {
  if (!symbol) return;
  FIN_SYM = symbol;
  $('sheet').classList.add('on');
  $('sheet').scrollTop = 0;
  if (force || !FIN_DATA || FIN_DATA.symbol !== symbol) {
    FIN_DIV = 'BS';
    FIN_DATA = null;
    $('fin-body').innerHTML = none('DART 에서 재무제표를 받는 중…');
    try { FIN_DATA = await api('/api/financials?symbol=' + encodeURIComponent(symbol)); }
    catch (e) { return $('fin-body').innerHTML = none('불러오기 실패: ' + e.message); }
  }
  renderFin();
}
function closeFin() { $('sheet').classList.remove('on'); }
function finTab(div) { FIN_DIV = div; renderFin(); }

  const d = FIN_DATA;
  if (!d) return;

      <svg class="mk" viewBox="0 0 24 24" fill="none" stroke="#0F9D76" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5.5-5.5 3.5 3.5L21 6"/>
        <path d="M15 6h6v6"/></svg>
      <div><div><span class="b1">DartLab</span><span class="b2">Finance</span></div>

  const mk = /^\d{6}$/.test(d.symbol || '') ? 'KR' : 'US';  // config.market_of 와 같은 규칙
  const who = `<div class="who"><div class="n1">${esc(d.name || d.symbol)}</div>

  $('fin-body').innerHTML = brand + who + `<div class="card">
    <div class="seg">${Object.entries({BS: '재무상태표', IS: '손익계산서', CF: '현금흐름표'})
      .map(([k, v]) => `<button class="${k === FIN_DIV ? 'on' : ''}" onclick="finTab('${k}')">${v}</button>`)

function brokerAccount(a) {
  if (!a || a.error) return none('계좌를 못 읽었다: ' + esc((a && a.error) || '응답 없음'));
  const MK = {KR: '국내', US: '해외'};
  return Object.entries(a.markets || {}).map(([mk, v]) => {
    const head = `<div class="kv"><span><b>${MK[mk] || mk}</b> <span class="cd">${esc(v.venue || '')}</span></span>`;
    if (v.unavailable) return head + `<span class="st">미연결</span></div>
      <div class="why">${esc(v.unavailable)}</div>`;
    // 증권사가 안 준 값은 '—' 로 둔다. 0 으로 적으면 화면이 모르는 것을 안다고 말하게 된다.
    const cur = n => n == null ? '—' : v.currency === '$' ? '$' + Number(n).toFixed(2)
                                        : Math.round(n).toLocaleString('ko-KR') + '원';
    const rows = (v.positions || []).length ? v.positions.map(q => `
      <div class="row">
        <div class="grow">
          <div class="line1"><span class="nm">${esc(q.name)}</span><span class="cd">${esc(q.symbol)}</span></div>
          <div class="why mono">${num(q.qty)}주 · 평단 ${cur(q.avg)} → 현재 ${cur(q.last)}</div>
        </div>
        <div style="text-align:right;flex:0 0 auto">
          <div class="mono" style="font-weight:800">${cur(q.value)}</div>
          <div class="${cls(q.pnl_pct)}" style="font-weight:700;font-size:13px">${pct(q.pnl_pct)}${
            q.pnl == null ? '' : ' · ' + cur(q.pnl)}</div>
        </div></div>`).join('')
      : `<div class="why">보유 종목 없음</div>`;
    const totals = `
      <div class="kv"><span>예수금 (주문가능)</span><b>${cur(v.cash)}</b></div>
      <div class="kv"><span>매입금액</span><b>${cur(v.invested)}</b></div>
      <div class="kv"><span>평가금액</span><b>${cur(v.eval_amount)}</b></div>
      <div class="kv"><span>평가손익 (누적)</span>
        <b class="${cls(v.pnl)}">${cur(v.pnl)} · ${pct(v.return_pct)}</b></div>`;
    return head + `<b>${cur(v.equity)}</b></div>` + totals + rows;
  }).join('');
}

  if (o.unavailable) return card('주문 현황', '증권사 원장 · 미체결 + 체결', none(o.unavailable));
  const hhmmss = t => { const s = String(t || '').replace(/\D/g, '');
    return s.length >= 4 ? s.slice(0, 2) + ':' + s.slice(2, 4) : '—'; };
  const rows = (o.rows || []).length ? o.rows.map(r => `
    <div class="row"><span class="t">${esc(hhmmss(r.time))}</span>

    + (o.generated_at ? ` · ${esc(o.generated_at)}` : ''), rows);

function renderPortfolio(p, t, acct, ord) {
  const s = p.snapshot, dv = p.diversification;
  const COLORS = ['#0F9D76','#2F6FED','#E8892B','#E5484D','#8B5CF6','#14B8A6','#EC4899','#64748B'];
  const totalHeld = s.positions.reduce((a, x) => a + Number(x.value || 0), 0);
  let cursor = 0;
  const stops = s.positions.map((x, i) => { const start = cursor;
    cursor += totalHeld ? Number(x.value || 0) / totalHeld * 100 : 0;
    return `${COLORS[i % COLORS.length]} ${start}% ${cursor}%`; });
  const allocation = totalHeld ? `<div class="alloc"><div class="donut" style="background:conic-gradient(${stops.join(',')})">
      <b>${s.positions.length}종목<br>${won(totalHeld)}</b></div><div class="legend">${s.positions.map((x, i) => `
        <div class="lg"><i class="dot" style="background:${COLORS[i % COLORS.length]}"></i>
          <span class="grow">${esc(x.name || x.symbol)}</span><b>${(Number(x.value || 0) / totalHeld * 100).toFixed(1)}%</b></div>`).join('')}</div></div>`
    : none('보유 종목이 없다');
  const sleeves = Object.entries(s.sleeves).map(([k, v]) => `
    <div class="tile"><div class="k" style="white-space:nowrap">${k} · 목표 ${Math.round(v.target_weight * 100)}%</div>
      <div class="v">${won(v.equity)}</div>
      <div class="n">현금 ${won(v.cash)}</div>
      <div class="n">실현 <b class="${v.realized_pnl >= 0 ? 'pos' : 'neg'}">${won(v.realized_pnl)}</b></div></div>`).join('');

  const pos = s.positions.length ? s.positions.map(x => `
    <div class="row"><div class="grow">
      <div class="line1"><span class="nm">${esc(x.name || x.symbol)}</span><span class="cd">${esc(x.symbol)}</span><span class="st">${esc(x.sleeve)}</span></div>
      <div class="why mono">${x.qty}주 · 평단 ${marketMoney(x.avg_price, /^[0-9]{6}$/.test(x.symbol) ? 'KR' : 'US')} → ${marketMoney(x.last_price, /^[0-9]{6}$/.test(x.symbol) ? 'KR' : 'US')}</div>
    </div><div style="text-align:right">
      <div class="mono" style="font-weight:800;font-size:16px">${won(x.value)}</div>
      <div class="${x.unrealized_pct >= 0 ? 'pos' : 'neg'}" style="font-weight:700">${pct(x.unrealized_pct)}</div>
    </div>${CHEV}</div>`).join('') : none('보유 종목이 없다');

  const divBody = dv.unavailable ? none(dv.unavailable) : dv.note ? none(dv.note) : `
    <div class="kv"><span>실질 분산 (덩어리/종목)</span><b>${dv.effective_groups}/${dv.symbols}</b></div>
    <div class="kv"><span>판정</span><b>${esc(dv.concentration || '—')}</b></div>
    ${(dv.highest_pairs || []).map(x => `<div class="kv"><span class="mono">${esc(x.pair)}</span><b>${x.corr}</b></div>`).join('')}`;

  const markets = Object.entries(s.market_allocation || {}).map(([mk, v]) => `
    <div class="tile"><div class="k">${mk === 'KR' ? '국내' : '해외'} 투입</div>
      <div class="v">${won(v.value)}</div><div class="n">${pct(v.weight * 100)} / 상한 ${v.max_weight * 100}%</div></div>`).join('');

  const log = t.rows.length ? t.rows.map(r => `
    <div class="row"><span class="t">${hhmm(r.ts)}</span>
      <span class="badge b-${esc(r.action)}">${esc(r.action)}</span>
      <div class="grow">
        <div><span class="nm" style="font-size:16px">${esc(r.name)}</span>
          <span class="st st-${esc(r.status)}">${esc(r.status)}</span>
          ${r.forced ? '<span class="st st-REJECTED">손절</span>' : ''}</div>
        <div class="why mono">${num(r.filled_qty ?? r.quantity)}주 @ ${num(r.price)}${
          r.filled_qty != null && r.filled_qty !== r.quantity ? ` <b class="neg">(요청 ${num(r.quantity)}주)</b>` : ''}${
          r.amount != null ? ` · ${won(r.amount)}` : ''}${
          r.realized_pnl != null ? ` · 실현 <b class="${r.realized_pnl >= 0 ? 'pos' : 'neg'}">${won(r.realized_pnl)}</b>` : ''}</div>
        ${r.order_no ? `<div class="why mono">주문번호 ${esc(r.order_no)}${
          r.venue ? ' · ' + esc(r.venue) : ''}</div>` : ''}
        <div class="why">${esc(clip(r.rejected || r.reason || '', 120))}</div>
      </div></div>`).join('') : none('거래 기록이 없다 — 자동매매를 켜거나 Run 을 눌러라');

  $('tab-portfolio').innerHTML =
    card(acct && acct.mode === 'mock' ? '모의투자 계좌' : '실계좌',
      acct && acct.mode === 'mock' ? '키움증권 모의투자 · 주문 없는 조회' : '증권사가 말하는 실제 보유 · 조회 전용',
      brokerAccount(acct)) +
    ordersCard(ord) +
    card('모의전략 통합원장', `자체 장부 · 국내 키움 모의 · 해외 로컬 모의 · 총 ${won(s.equity)} · 당일 ${pct(s.day_return_pct)}`,
      `<div class="tiles" style="margin-top:0">${markets}</div><div class="tiles">${sleeves}</div>`) +
    card('보유 종목 비중', `${s.positions.length}종목 · 원화 환산`, allocation + pos) +
    card('분산', '같이 움직이는가', divBody) +
    card('실시간 거래 기록', `최근 ${t.rows.length}건 · 체결 · 거부 · 손절`, log);
}

/* ---------------------------------------------------------------- Control */
function renderControl(d) {
  const mk = m => m === '✓' ? 'pos' : m === '✗' ? 'neg' : 'flat';
  $('tab-control').innerHTML =
    card('연결 점검', '조회만 한다 — 주문은 내지 않는다',
      d.checks.map(c => `<div class="row"><b class="${mk(c.mark)}" style="font-size:19px">${c.mark}</b>
        <div class="grow"><b style="font-size:16px">${esc(c.label)}</b>
        <div class="why">${esc(c.detail)}</div></div></div>`).join('')) +
    card('사람이 정한 경계', 'AI 가 바꿀 수 없는 값', `
      <div class="kv"><span>슬리브</span><b>안정 ${d.guardrails.sleeves.STABLE * 100}% : 공격 ${d.guardrails.sleeves.AGGRESSIVE * 100}%</b></div>
      <div class="kv"><span>종목당 상한</span><b>${d.guardrails.max_position_pct}%</b></div>
      <div class="kv"><span>국내/해외 상한</span><b>${d.guardrails.market_weights.KR * 100}% / ${d.guardrails.market_weights.US * 100}%</b></div>
      <div class="kv"><span>USD/KRW 환산</span><b>${Number(d.guardrails.usd_krw).toLocaleString('ko-KR')}</b></div>
      <div class="kv"><span>손절</span><b class="neg">${d.guardrails.stop_loss_pct}%</b></div>
      <div class="kv"><span>익절 문턱</span><b class="pos">+${d.guardrails.take_profit_pct}% <span class="cap">(팔아야 하는 선이 아니라 팔아도 되는 문턱)</span></b></div>
      <div class="kv"><span>당일 정지</span><b class="neg">${d.guardrails.daily_loss_kill_pct}%</b></div>
      <div class="kv"><span>판단 주기</span><b>${d.guardrails.cycle_seconds}초</b></div>
      <div class="kv"><span>호가 감시</span><b>${d.guardrails.watch_seconds}초 <span class="cap">(LLM 미호출)</span></b></div>
      <div class="kv"><span>주문 세션</span><b>${esc((d.guardrails.kr_sessions || []).join(', '))}</b></div>
      <div class="kv"><span>사이클당 최대 주문</span><b>${d.guardrails.max_orders_per_cycle}건</b></div>
      <div class="kv"><span>벤치마크</span><b>${esc(d.guardrails.benchmark)}</b></div>
      <div class="kv"><span>실주문</span><b class="${d.guardrails.live_trading ? 'neg' : 'pos'}">${
        d.guardrails.live_trading ? '허용 (AI_TRADER_LIVE=1)' : '차단'}</b></div>
      <div class="kv"><span>.env</span><b>${d.env_loaded ? '로드됨' : '없음'}</b></div>`) +
    card('유니버스', `${d.universe.length}종목 · 관찰 대상`,
      d.universe.map(u => `<div class="kv"><span><b>${esc(u.name)}</b> <span class="cd">${esc(u.symbol)}</span></span>
        <span class="st">${esc(u.market)}</span></div>`).join(''));
}

/* ------------------------------------------------------------------- boot */
async function loadAll() {
  const set = (id, h) => $(id).innerHTML = h;
  try { renderCommand(await api('/api/command')); }
  catch (e) { set('tab-command', none('불러오기 실패: ' + e.message)); }
  try { renderRadar(await api('/api/radar')); }
  catch (e) { set('tab-radar', none('불러오기 실패: ' + e.message)); }
  try { renderPortfolio(await api('/api/portfolio'), await api('/api/trades'),
                        await api('/api/account').catch(e => ({error: e.message})),
                        await api('/api/orders').catch(e => ({error: e.message}))); }
  catch (e) { set('tab-portfolio', none('불러오기 실패: ' + e.message)); }
  try { renderControl(await api('/api/control')); }
  catch (e) { set('tab-control', none('불러오기 실패: ' + e.message)); }
  $('sub').textContent = '부자가 되는 가장 빠른 지름길';
}
document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x === b));
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.id === 'tab-' + b.dataset.tab));
  scrollTo(0, 0);
});
loadAll();
setInterval(loadAll, 60000);
</script>
</body>
</html>
